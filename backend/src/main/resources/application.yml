server:
  address: 127.0.0.1
  port: 18765
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: jarpatch-studio-backend
  datasource:
    driver-class-name: org.sqlite.JDBC
    # busy_timeout 通过 URL 参数下发给连接池创建的每一个连接；连接池按生命周期重建
    # 连接时不会重放 DatabaseInitializer 里的 PRAGMA，缺少该参数的连接遇到库级并发
    # 会直接抛 SQLITE_BUSY 而不是等待。
    url: jdbc:sqlite:${user.home}/.jarpatch-studio/jarpatch-studio.db?busy_timeout=5000
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON

logging:
  file:
    name: ${JARPATCH_LOG_FILE:${user.home}/.jarpatch-studio/logs/backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
      total-size-cap: 50MB
      clean-history-on-start: false

jarpatch:
  workspace-root: ${user.home}/.jarpatch-studio/projects
  local-access:
    token: ${JARPATCH_AUTH_TOKEN:}
    instance-id: ${JARPATCH_INSTANCE_ID:}
    allowed-origin: ${JARPATCH_ALLOWED_ORIGIN:null}
  diagnostics:
    application-version: "@project.version@"
    log-file: ${JARPATCH_LOG_FILE:${user.home}/.jarpatch-studio/logs/backend.log}
    recent-task-log-limit: 200
    recent-backend-log-limit: 200
    max-message-length: 500
  archive-limits:
    max-archive-bytes: 1073741824
    max-entry-count: 200000
    max-uncompressed-bytes: 4294967296
    max-entry-bytes: 536870912
    max-compression-ratio: 1000
    max-path-depth: 64
